global:
  scrape_interval: 1m

# Alert rules live in their own file so they can be copied into a production
# Prometheus unchanged. See alerts.yaml for the thresholds and what each one
# means.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 1m
    static_configs:
      - targets: ["localhost:9090"]
    metric_relabel_configs:
      # Replace dots with underscores in label keys
      - action: labelmap
        regex: '(.+)\.(.+)'
        replacement: "${1}_${2}"

storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m
# tracing:
#   endpoint: "localhost:4317"
#   insecure: true
#   compression: "gzip"
#   timeout: "10s"

otlp:
  keep_identifying_resource_attributes: true
  translation_strategy: UnderscoreEscapingWithSuffixes
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
