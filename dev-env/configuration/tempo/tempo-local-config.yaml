stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9097
  log_level: info

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1073741824
  trace_by_id:
    duration_slo: 100ms
  metrics:
    max_duration: 120h
    query_backend_after: 5m
    duration_slo: 5s
    throughput_bytes_slo: 1073741824

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  # Flush trace blocks quickly so search/metrics see data with little delay.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: podman
    collection_interval: 15s
  # Local WAL for the generator's own trace storage (required in 2.x).
  traces_storage:
    path: /tmp/tempo/generator/traces
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      # Pod containers share the network namespace, so Prometheus is reachable
      # on localhost:9090. Requires --web.enable-remote-write-receiver.
      - url: http://localhost:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      dimensions: []
    span_metrics:
      dimensions: []

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
    block:
      bloom_filter_false_positive: .05
    pool:
      max_workers: 100
      queue_depth: 10000

overrides:
  defaults:
    metrics_generator:
      # Block-style list — the flow-style form did not parse into the
      # per-tenant enabled-processors set on Tempo 2.8.
      processors:
        - service-graphs
        - span-metrics
      # Classic histograms produce the *_bucket series the dashboards query.
      generate_native_histograms: classic
