name: Release
on:
  push:
    tags:
      - v[0-9].[0-9]+.[0-9]*

env:
  MAKE_STOP_ON_ERRORS: true

permissions:
  id-token: write
  security-events: write
  actions: write
  contents: write
  pull-requests: read
  packages: write

defaults:
  run:
    # Explicit, because the runner's default is not the same shell everywhere and this one
    # brings `pipefail` with it: a step whose pipeline fails in an earlier stage now fails
    # the step instead of reporting the exit code of the last command in it.
    #
    # This matters here: every make step below is piped into `tee -a $GITHUB_STEP_SUMMARY`,
    # and without pipefail a failing `make` is masked by tee's exit code 0.
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
          cache-dependency-path: |
            **/go.sum
            **/vendor/**/go.sum

      - name: Summary Information
        run: |
          echo "# Release Summary" > $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Tools and versions
        run: |
          echo "## Tools and versions" >> $GITHUB_STEP_SUMMARY

          ubuntu_version=$( (lsb_release -a 2>/dev/null || true) | awk -F'\t' '/Description/{print $2}')
          echo "Ubuntu version: $ubuntu_version"
          echo "**Ubuntu Version:** $ubuntu_version" >> $GITHUB_STEP_SUMMARY

          bash_version=$(bash --version | awk 'NR==1{print $4}')
          echo "Bash version: $bash_version"
          echo "**Bash Version:** $bash_version" >> $GITHUB_STEP_SUMMARY

          git_version=$(git --version | awk '{print $3}')
          echo "Git version: $git_version"
          echo "**Git Version:** $git_version" >> $GITHUB_STEP_SUMMARY

          make_version=$(make --version | awk 'NR==1{print $3}')
          echo "Make version: $make_version"
          echo "**Make Version:** $make_version" >> $GITHUB_STEP_SUMMARY

          go_version=$(go version | awk '{print $3}')
          echo "Go version: $go_version"
          echo "**Go Version:** $go_version" >> $GITHUB_STEP_SUMMARY

      - name: make install-swag
        run: |
          echo "## Make install-swag" >> $GITHUB_STEP_SUMMARY
          make install-swag | tee -a $GITHUB_STEP_SUMMARY

      - name: Make tests
        run: |
          echo "## Make tests" >> $GITHUB_STEP_SUMMARY
          make test | tee -a $GITHUB_STEP_SUMMARY

      - name: Make build-dist
        run: |
          echo "## Make build-dist" >> $GITHUB_STEP_SUMMARY
          GIT_VERSION=${{ github.ref_name }} make build-dist | tee -a $GITHUB_STEP_SUMMARY

      - name: Make build-dist-zip
        run: |
          echo "## Make build-dist-zip" >> $GITHUB_STEP_SUMMARY
          GIT_VERSION=${{ github.ref_name }} make build-dist-zip | tee -a $GITHUB_STEP_SUMMARY

      - name: Upload Distribution files
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./dist/
          retention-days: 1

  # Builds one image per CONTAINER_OS x CONTAINER_ARCH from the binaries the
  # build job produced, assembles them into a multi-arch manifest, and pushes
  # it to this repository's GitHub Container Registry as
  #   ghcr.io/<owner>/<repo>:<tag>  and  ghcr.io/<owner>/<repo>:latest
  #
  # This used to be `uses: slashdevops/gha-workflows/.../container-image.yml`.
  # The steps below are that workflow's steps, inlined for two reasons:
  #
  #   - it ran `make container-build | tee ...` WITHOUT `pipefail`, so make's
  #     exit code was replaced by tee's. Every release reported this job green
  #     while `podman build --platform darwin/arm64` had failed (distroless has
  #     no darwin image) and nothing had been pushed. `defaults.run.shell: bash`
  #     at the top of this file brings pipefail, and `MAKE_STOP_ON_ERRORS`
  #     makes the Makefile propagate the failure in the first place.
  #   - a template should not depend on a reusable workflow in another
  #     organisation to publish its own image.
  #
  # `packages: write` above is what lets GITHUB_TOKEN push to ghcr.io; the
  # image is private until it is made public in the package settings.
  containers:
    name: Publish container images
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ubuntu-latest ships podman; the install is a no-op there and a
      # safeguard on a runner image that does not.
      - name: Install podman
        run: |
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }
          podman --version

      - name: Summary Information
        run: |
          echo "# Container Image Summary" > $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Podman:** $(podman --version | awk '{print $3}')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # The Containerfile COPYs dist/<service>-<os>-<arch>, so the image is
      # built from exactly the binaries the release ships, not a second build.
      - name: Download Distribution files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./dist/

      - name: Make container-build
        run: |
          echo "## Make container-build" >> $GITHUB_STEP_SUMMARY
          GIT_VERSION=${{ github.ref_name }} MAKE_DEBUG=true make container-build | tee -a $GITHUB_STEP_SUMMARY

      - name: Show container images
        run: |
          echo "## Container images" >> $GITHUB_STEP_SUMMARY
          podman images | tee -a $GITHUB_STEP_SUMMARY

      - name: Make container-login
        env:
          REPOSITORY_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          echo "## Make container-login" >> $GITHUB_STEP_SUMMARY
          make container-login | tee -a $GITHUB_STEP_SUMMARY

      - name: Make container-publish
        run: |
          echo "## Make container-publish" >> $GITHUB_STEP_SUMMARY
          GIT_VERSION=${{ github.ref_name }} MAKE_DEBUG=true make container-publish | tee -a $GITHUB_STEP_SUMMARY

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, containers]
    steps:
      # - uses: actions/checkout@v7

      - name: Download Distribution files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./dist/

      - name: Create Release
        id: create-github-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            dist/assets/*.zip
