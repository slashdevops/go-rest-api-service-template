# Configuration for github.com/vladopajic/go-test-coverage.
#
# Run it with `make test-coverage`, which reads the profile `make test` writes.

# Path to coverage profile file (output of `go test -coverprofile`).
#
# For cases where there are many coverage profiles -- unit and integration run
# separately, say -- this may be a comma-separated list and the tool will merge
# them. That does NOT help here; see the note on `total` below.
profile: build/coverage.txt

# Reported file paths will not contain this prefix.
local-prefix: "github.com/slashdevops/go-rest-api-service-template"

threshold:
  # Minimum coverage percentage required for individual files.
  file: 0

  # Minimum coverage percentage required for each package.
  #
  # Zero, deliberately, with per-package floors in `override` below. One number
  # cannot describe this repo: the use-case layer is exercised by
  # tests/integration, which drives the API over HTTP against a SEPARATELY
  # RUNNING binary. None of that execution happens in a test process, so no
  # profile this gate can read will ever attribute it. Asking 20% of
  # `internal/core/usecase` from unit tags demands something the test strategy
  # does not produce, and a gate nobody can satisfy is a gate everybody ignores
  # -- which is exactly what happened while this file asked for 25% total.
  package: 0

  # Minimum overall project coverage percentage required.
  #
  # 19, against a measured 19.4%. This is a RATCHET, not an aspiration: its job
  # is to fail when coverage DROPS.
  #
  # It moved 13 -> 19 when the RAG/LLM layer was removed from this template.
  # That code was largely exercised by the integration suite rather than by unit
  # tests, so deleting it raised the measured percentage without a single test
  # being added. Raising the floor to match is the only way the bar moves.
  #
  # Raising it honestly means making out-of-process execution countable: build
  # the service with `go build -cover`, run tests/integration against it with
  # GOCOVERDIR set, convert with `go tool covdata textfmt`, and list both
  # profiles in `profile` above. Merging the integration test binary's own
  # profile does not work -- it records what ran inside the test process, and
  # the handlers and use-cases run in the other one.
  total: 20

# Per-package floors, generated from measured coverage and rounded DOWN to a
# ten so ordinary churn does not trip them. These are the packages unit tests
# genuinely cover, and the point of listing them is that one cannot quietly
# lose its tests while the project total stays flat.
#
# Regenerate after a real improvement -- raising a floor is the only way the
# bar moves. Measure the way this tool does, by STATEMENTS: a mean of the
# per-file percentages is a different number, and choosing floors from it put
# `middleware` 0.3 points above anything it could reach.
override:
  - path: ^pkg/cslog$
    threshold: 100 # measured 100.0%
  - path: ^internal/adapter/driving/http/respond$
    threshold: 90 # measured 97.1%
  - path: ^internal/adapter/driven/ratelimitbreaker$
    threshold: 90 # measured 96.3%
  - path: ^internal/adapter/driving/http/jwtvalidator$
    threshold: 90 # measured 96.2%
  - path: ^internal/adapter/driven/throttlememory$
    threshold: 90 # measured 95.8%
  - path: ^internal/core/port/driven/cache$
    threshold: 90 # measured 91.7%
  - path: ^internal/o11y$
    threshold: 90 # measured 91.2%
  - path: ^internal/adapter/driven/tokenjwt$
    threshold: 90 # measured 90.9%
  # LOWERED from 80 because CI no longer runs a Valkey service.
  #
  # These tests connect to Valkey and SKIP when they cannot, and a skip reports
  # `ok` -- so the package measures 17.6% here and 84.3% against a real one. 15
  # is the floor for the skipped shape: it still catches a regression that
  # deletes tests, and it does not fail a runner that was never given a Valkey.
  #
  # Re-enable the service block in .github/workflows/pr.yaml and this goes back
  # to 80. The two carry the same note for that reason.
  - path: ^internal/adapter/driven/ratelimitvalkey$
    threshold: 15 # measured 17.6% skipped / 84.3% against a real Valkey
  - path: ^internal/adapter/driven/cipheraes$
    threshold: 80 # measured 82.1%
  - path: ^internal/config$
    threshold: 80 # measured 80.6%
  - path: ^internal/adapter/driven/ratelimitmemory$
    threshold: 80 # measured 80.5%
  - path: ^internal/adapter/driving/http/middleware$
    threshold: 70 # measured 79.7%
  - path: ^internal/adapter/driven/changenotifyvalkey$
    threshold: 70 # measured 76.7% with a Valkey; its tests skip without one
  - path: ^internal/app$
    threshold: 40 # measured 47.1%
  - path: ^internal/adapter/driven/notifieremail/templates$
    threshold: 30 # measured 34.2%
  - path: ^internal/adapter/driven/notifieremail$
    threshold: 30 # measured 32.1%

exclude:
  # Exclude files or packages matching these paths.
  paths:
    - ^cmd/ # package main
    - ^mocks/ # generated mocks
    - ^database # migrations and seed data, not Go under test
    - ^docs/ # swagger output, generated by `make build`

# File name of go-test-coverage breakdown file, which can be used to
# analyze coverage difference.
breakdown-file-name: ""

diff:
  # File name of go-test-coverage breakdown file which will be used to
  # report coverage difference.
  base-breakdown-file-name: ""
