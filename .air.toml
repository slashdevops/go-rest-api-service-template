root         = "."
testdata_dir = "testdata"
tmp_dir      = "build/tmp"

[build]
args_bin = [
  "-log.level=ctrace",
  "-log.add.source=true",
  "-opentelemetry.trace.exporter=otlp-http",
  "-opentelemetry.metric.exporter=otlp-http",
  # The token lifetimes are not flags any more: they are a database row seeded
  # at 5m / 24h and edited through PUT /auth/token_lifetimes. Dev runs the seed,
  # for the reason the old 24h override was removed -- the access token's
  # lifetime IS the residual-access window after a logout, and a long override
  # hid every consequence of that locally: refresh was never exercised, and the
  # frontend bug that made refresh 404 survived because nothing reached it.
  "-authn.private.key.file=./certs/jwt.key",
  "-authn.public.key.file=./certs/jwt.pub",
  "-authn.symmetric.key.file=./certs/aes-256-symmetric-hex.key",
  "-http.server.pprof.enabled=false",
  "-http.server.swagger.enabled=true",
  "-authn.seed.admin.password.allowed=true",
  "-http.client.allow.private.addresses=true",
  "-http.server.cors.enabled=true",
  "-http.server.cors.allowed.origins=*",
  # The dev stack talks to the API directly, so nothing is trusted to
  # forward for it. Leaving this empty is what the integration suite
  # asserts: a rotating X-Forwarded-For must not multiply the budget.
  "-http.server.trusted.proxies=",
  "-http.server.address=0.0.0.0",
  "-http.server.port=8080",
  "-http.server.tls.enabled=false",
  "-http.server.tls.cert.file=./certs/goapitemplate.local.crt",
  "-http.server.tls.key.file=./certs/goapitemplate.local.key",
  "-mail.smtp.host=localhost",
  "-mail.smtp.port=1025",
  "-mail.smtp.username=welcome@goapitemplate.local",
  "-mail.smtp.password=new_secure_password",
  "-mail.smtp.require.tls=false",
  "-cache.enabled=true",
  # Rules are OFF by default so an upgrade keeps its current behaviour, but the
  # dev stack turns them ON deliberately. A dev stack that disagrees with what
  # is deployed hides the deployed thing's bugs -- the same rule the IP limiter
  # and the token lifetimes are already written down for. run.sh matches, and
  # TestRunScriptAndAirAgree fails if the two drift.
  "-ratelimit.enabled=true",
  "-cache.tls.enabled=true",
  "-cache.tls.ca.file=./certs/dev/ca.crt",
  "-database.ssl.mode=verify-full",
  "-database.ssl.root.cert.file=./certs/dev/ca.crt",
  "-cache.client.enabled=true",
]
entrypoint = "./build/go-rest-api-service-template"
cmd = "make build"
delay = 10
exclude_dir = [
  "cmd/uuidgen",
  "cmd/saltpwd",
  "cmd/apiendpoints",
  "database/migrations",
  "certs",
  "node_modules",
  "frontend",
  "assets",
  "tmp",
  "vendor",
  "testdata",
  "docs",
  "build",
  "mocks",
  "dev-env",
  "test",
  "tests",
  "dist",
  "tests/integration",
]
exclude_file = [
  "docs/docs.go",
]
exclude_regex = [
  "_test.go",
  ".tmpl",
]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
include_dir = [
]
include_ext = [
  "go",
  "tpl",
  "tmpl",
  "html",
]
include_file = [
]
kill_delay = "5s"
log = "air-build-errors.log"
poll = false
poll_interval = 0
post_cmd = [
]
pre_cmd = [
]
rerun = false
rerun_delay = 500
send_interrupt = true
stop_on_error = true

[color]
app     = ""
build   = "yellow"
main    = "magenta"
runner  = "green"
watcher = "cyan"

[log]
main_only = false
time      = false

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll      = true
