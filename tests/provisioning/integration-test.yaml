# NOTE: If you generated this yaml from an unprivileged and rootless podman container on an SELinux
# enabled system, check the podman generate kube man page for steps to follow to ensure that your pod/container
# has the right permissions to access the volumes added.
# References:
# https://developers.redhat.com/blog/2019/01/15/podman-managing-containers-pods#
# https://www.redhat.com/sysadmin/podman-play-kube-updates
---
apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: "2024-05-04T14:57:16Z"
  labels:
    app: integration-tests
  name: integration-tests
spec:
  containers:
    - name: postgres
      # PostgreSQL 18 for native uuidv7(); no pgvector needed.
      image: docker.io/library/postgres:18
      args:
        - postgres
      env:
        - name: TZ
          value: UTC
        - name: PGTZ
          value: UTC
        - name: POSTGRES_PASSWORD
          value: password
        - name: POSTGRES_USER
          value: username
        - name: POSTGRES_DB
          value: go-rest-api-service-template
      ports:
        - containerPort: 5432
          hostPort: 5432
      # volumeMounts:
      #   - name: db-volume-host
      #     mountPath: /var/lib/postgresq/data

    - name: valkey
      image: docker.io/valkey/valkey:latest
      ports:
        - containerPort: 6379
          hostPort: 6379
          protocol: TCP
    - name: go-rest-api-service-template
      image: localhost/slashdevops/go-rest-api-service-template:test-integration
      args:
        - "-debug"
        - "-log.add.source=true"
        - "-opentelemetry.trace.exporter=noop"
        - "-opentelemetry.metric.exporter=noop"
        # No token-lifetime overrides: the suite runs the shipped defaults, the
        # same as the dev stack and production. A 24h access token here meant
        # the containerised run never exercised refresh at all, so it could not
        # have caught the rotation contract or the frontend's refresh path.
        - "-authn.private.key.file=/app/certs/jwt.key"
        - "-authn.public.key.file=/app/certs/jwt.pub"
        - "-authn.symmetric.key.file=/app/certs/aes-256-symmetric-hex.key"
        - "-http.server.cors.enabled=true"
        - "-http.server.cors.allowed.origins=http://localhost:8080,http://localhost:5173"
        - "-http.server.pprof.enabled=false"
        # Rate limiting off: the suite fires many requests from one address, and
        # a limit would make failures depend on test ORDER rather than on the code.
        - "-ratelimit.enabled=false"
        - "-http.server.port=8080"
        - "-http.server.address=0.0.0.0"
        # mailpit accepts plaintext on :1025, so opt out of the secure-by-default TLS requirement
        - "-mail.smtp.require.tls=false"
      ports:
        - containerPort: 8080
          hostPort: 8080
          protocol: TCP

    # https://github.com/axllent/mailpit
    - name: mailpit
      image: axllent/mailpit
      args:
        - "--smtp-auth-allow-insecure"
        - "--smtp-auth-accept-any"
      ports:
        - containerPort: 8025
          hostPort: 8025
          protocol: TCP
        - containerPort: 1025
          hostPort: 1025
          protocol: TCP

  # volumes:
  #   - name: db-volume-host
  #     hostPath:
  #       path: /tmp/go-rest-api-service-template/db-volume-host
  #       type: DirectoryOrCreate
