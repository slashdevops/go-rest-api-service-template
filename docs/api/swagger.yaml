externalDocs:
  description: Architecture and operational documentation
  url: https://github.com/slashdevops/go-rest-api-service-template/tree/main/docs
info:
  contact:
    email: info@goapitemplate.local
    name: API Support
    url: https://goapitemplate.local
  description: |-
    A production-shaped starting point for a Go HTTP REST API: hexagonal architecture, multi-tenant projects, RBAC through Open Policy Agent, database-backed rate limiting and resource limits, and OpenTelemetry traces and metrics throughout.

    `products` is the worked example entity -- a project-scoped CRUD resource that exercises every convention here. Copy it when adding your own; see docs/architecture/adding-an-entity.md.

    ### Authentication

    Four bearer credentials, each accepted by a different set of endpoints; see the security definitions below for which is which. Ordinary calls use **AccessToken**.

    A logout revokes the access token it was called with, not only the refresh token, so it stops working immediately. That check can be switched off (`authn.access.token.revocation.enabled`), and where it is, a logged-out access token keeps working until it expires -- which is why the lifetime is short.

    Refresh tokens are rotated: each refresh spends the token it was given and returns a successor, so a client **must** store what `POST /auth/refresh` returns. Presenting a spent one again reads as a replay and ends the session for whoever holds the live token too.

    ### Conventions

    - **Identifiers are UUID v7.** Every `id` in this API, without exception.
    - **List endpoints share one shape**: `limit`, `next_token`, `prev_token`, `sort`, `filter` and `fields`, answering `{ items, paginator }`. Paginate with the tokens rather than an offset.
    - **Errors are `payload.HTTPMessage`**: a message, the method and path, and the status code. Some carry a machine-readable `code`; match on that and never on the prose, which may be reworded.
    - **Timestamps are RFC 3339**, and every entity carries `created_at` and `updated_at`.

    ### Rate limiting

    Every endpoint may answer `429`, and the two reasons are not interchangeable:

    - `RATE_LIMIT_EXCEEDED` — a budget was spent. `Retry-After` says when to come back.
    - `RATE_LIMIT_UNAVAILABLE` — the limiter's own shared counter is unreachable and the service is failing closed. Nobody is being limited *correctly*; this is an operator condition, not a signal to the caller to slow down.

    `/health/*` and `/version` bypass the limiter, so an outage of it never makes the service look unreachable.

    ### Operations

    - `GET /health/live` — liveness. Checks nothing else on purpose: restarting cannot fix a dependency that is down.
    - `GET /health/detailed` — readiness, per component. `200` healthy, `206` degraded, `503` a hard dependency is gone.
    - `GET /health/status` — a public, deliberately thin verdict for anyone who cannot present a token.
    - `GET /version` — the build this instance was made from.
  title: Go REST API Service Template API
  version: v1
paths:
  /auth/idp/{idp_id}/callback:
    get:
      description: 'Called by the frontend callback route with the state and code
        from the provider, never by the browser: JSON answer, no cookie, no redirect.
        Spends the state, exchanges the code with PKCE, resolves the identity by subject'
      operationId: 01988e60-89e5-72ee-9db4-db5cd7535717
      parameters:
      - description: Identity provider id
        format: uuid
        in: path
        name: idp_id
        required: true
        type: string
      - description: The state the provider echoed back
        in: query
        name: state
        required: true
        type: string
      - description: The authorization code, absent when the provider reports an error
        in: query
        name: code
        type: string
      - description: The provider's error code, for example access_denied
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The outcome
          schema:
            $ref: '#/definitions/payload.IDPCallbackResponse'
        "400":
          description: A state that is missing, spent, expired or minted for another
            provider, or a missing code
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "401":
          description: The provider refused the sign-in, or the identity is not linked
            to an account here
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "404":
          description: Unknown or disabled identity provider
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "409":
          description: The identity is already linked to an account
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "503":
          description: The identity provider is not reachable
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
      summary: Handle IDP OAuth callback
      tags:
      - AuthnIDPs
  /auth/idp/{idp_id}/link:
    get:
      description: 'Build the authorization URL for linking a provider identity to
        the signed-in account. The only way an existing account gains one: the session
        proves the account, the provider proves the identity'
      operationId: 01a07319-1d32-7bd2-8ba0-f7da9aaaed0a
      parameters:
      - description: Identity provider id
        format: uuid
        in: path
        name: idp_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The URL to send the browser to
          schema:
            $ref: '#/definitions/payload.IDPLoginResponse'
        "400":
          description: Invalid identity provider id
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "401":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "403":
          description: Not authorized
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "404":
          description: Unknown or disabled identity provider
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "503":
          description: The identity provider is not reachable
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
      security:
      - AccessToken: []
      summary: Initiate IDP link
      tags:
      - AuthnIDPs
  /auth/idp/{idp_id}/login:
    get:
      description: Build the authorization URL for a sign-in. The caller sends the
        browser there; the provider returns it to the frontend callback route with
        a state and a code
      operationId: 01988e60-89e5-72ab-adb4-3eef95d1afd3
      parameters:
      - description: Identity provider id
        format: uuid
        in: path
        name: idp_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The URL to send the browser to
          schema:
            $ref: '#/definitions/payload.IDPLoginResponse'
        "400":
          description: Invalid identity provider id
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "404":
          description: Unknown or disabled identity provider
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "503":
          description: The identity provider is not reachable
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
      summary: Initiate IDP login
      tags:
      - AuthnIDPs
  /auth/idp/{idp_id}/register:
    get:
      description: Build the authorization URL for a registration. Same flow as a
        login; the callback creates the account when the provider vouches for the
        email and allows auto-provisioning
      operationId: 019894ba-6014-79cf-bff4-6668484cc7e3
      parameters:
      - description: Identity provider id
        format: uuid
        in: path
        name: idp_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The URL to send the browser to
          schema:
            $ref: '#/definitions/payload.IDPRegisterResponse'
        "400":
          description: Invalid identity provider id
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "404":
          description: Unknown or disabled identity provider
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "503":
          description: The identity provider is not reachable
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
      summary: Initiate IDP registration
      tags:
      - AuthnIDPs
  /auth/idp/available:
    get:
      description: Retrieve every ENABLED identity provider, for the login page. Disabled
        providers stay configured and are not offered
      operationId: 0198fb33-7333-76f9-bcb4-1af086de3e10
      produces:
      - application/json
      responses:
        "200":
          description: The providers
          schema:
            $ref: '#/definitions/payload.ListIDPAvailableResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
      summary: List identity providers
      tags:
      - AuthnIDPs
  /auth/idp_types:
    get:
      description: Retrieve a paginated list of all Identity Provider Types available
        for authentication.
      operationId: 0198f1e2-14ff-7678-afbe-9a627b0eaabd
      parameters:
      - description: Sort by fields (comma-separated with ASC/DESC)
        in: query
        name: sort
        type: string
      - description: Filter expression for querying results
        in: query
        name: filter
        type: string
      - description: Comma-separated list of fields to return
        in: query
        name: fields
        type: string
      - description: Pagination cursor for next page
        in: query
        name: next_token
        type: string
      - description: Pagination cursor for previous page
        in: query
        name: prev_token
        type: string
      - description: 'Maximum number of items to return (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of IDP types retrieved successfully
          schema:
            $ref: '#/definitions/payload.ListIDPTypesResponse'
        "400":
          description: Invalid request - malformed query parameters
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "401":
          description: Missing or invalid authentication token
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "403":
          description: Insufficient permissions
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "429":
          description: Too many requests -- RATE_LIMIT_EXCEEDED is the budget, RATE_LIMIT_UNAVAILABLE
            the limiter's own store
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
      security:
      - AccessToken: []
      summary: List IDP types
      tags:
      - Authentication
      - Identity Provider Types
  /auth/idp_types/{idp_type_id}:
    get:
      description: Retrieve a specific Identity Provider Type by its unique identifier
      operationId: 0198f1e2-14ff-767c-971c-3904e0f2c484
      parameters:
      - description: IDP type unique identifier (UUID v7)
        in: path
        name: idp_type_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: IDP type details retrieved successfully
          schema:
            $ref: '#/definitions/payload.IDPTypesResponse'
        "400":
          description: Invalid request - malformed UUID or invalid parameters
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "401":
          description: Missing or invalid authentication token
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "403":
          description: Insufficient permissions
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "404":
          description: IDP type not found
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "429":
