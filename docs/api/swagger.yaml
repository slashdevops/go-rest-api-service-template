  /health/detailed:
    get:
      description: 'Per-component health, database pool stats and startup metrics,
        with the status code carrying the verdict: 200 healthy, 206 degraded, 503
        a hard dependency is unreachable. This is the READINESS target — it answers
        whether this instance should receive traffic. Point liveness at /health/live,
        which deliberately checks nothing.'
      operationId: 01982304-a1b2-7eec-8bf3-84f51fd09b74
      produces:
      - application/json
      responses:
        "200":
          description: Every component is healthy
          schema:
            $ref: '#/definitions/payload.DetailedHealth'
        "206":
          description: One or more components are DEGRADED; the same payload is returned
            with the per-component details. A client polling this endpoint must treat
            206 as a reachable service, not as a failure. Note that ratelimit_store
            degraded under the default fail-closed mode means the service is refusing
            every request with 429 -- reachable, but serving nothing
          schema:
            $ref: '#/definitions/payload.DetailedHealth'
        "401":
          description: Invalid or expired token. This endpoint names every component,
            its configuration and its timings, so it requires authentication -- unlike
            /health/live and /health/status, which an orchestrator must be able to
            reach without a token
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "403":
          description: Not authorized
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "500":
          description: The check could not be completed. The body carries a fixed
            message and never the underlying error. The reason is on the span and
            in an ERROR log
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
        "503":
          description: 'A HARD dependency is unreachable -- currently the database
            -- so this instance cannot serve. A load balancer or readiness probe should
            take it out of rotation. Two components are deliberately excluded from
            this code and can only reach 206: the cache, because it is fail-open and
            a request still succeeds without it; and the rate-limit store, because
            health and version bypass the limiter precisely so its outage cannot evict
            a replica, and failing readiness would reintroduce that eviction by the
            other door -- on every replica at once, since they share the store'
          schema:
            $ref: '#/definitions/payload.DetailedHealth'
      security:
      - AccessToken: []
      summary: Readiness probe and detailed health
      tags:
      - Health
  /health/live:
    get:
      description: 'Answers 200 whenever this process can serve HTTP. It checks NOTHING
        else — no database, no cache — on purpose: a liveness probe decides whether
        to RESTART the process, and restarting cannot fix a dependency that is down.
        Point a readiness probe at /health/detailed instead, which does reflect dependencies.'
      operationId: 01a02ec9-ac6c-77c2-81ad-d6e2f23bcd92
      produces:
      - application/json
      responses:
        "200":
          description: The process is alive and serving requests
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
      summary: Liveness probe
      tags:
      - Health
  /health/status:
    get:
      description: 'A human-readable summary including database connectivity and runtime
        metrics. NOT a probe: it pings the database inside a five second budget, so
        it hangs as long as the database does, and when the ping fails it answers
        500 and discards the summary — no verdict a probe could act on. Point liveness
        at /health/live and readiness at /health/detailed.'
      operationId: 01982303-f0f9-7eec-8bf3-84f51fd09b73
      produces:
      - application/json
      responses:
        "200":
          description: Service health status retrieved successfully
          schema:
            $ref: '#/definitions/payload.Health'
        "500":
          description: 'The check could not be completed -- currently, the database
            ping failed. The body carries a fixed message and never the underlying
