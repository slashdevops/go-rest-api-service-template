definitions:
  domain.Check:
    description: 'One component''s health verdict. Status only: this endpoint is public'
    properties:
      kind:
        example: database
        format: string
        type: string
      name:
        example: database
        format: string
        type: string
      status:
        description: Health status of a service.
        example: true
        format: string
        type: boolean
    type: object
  domain.ComponentHealth:
    description: Health status of an individual component.
    properties:
      details:
        additionalProperties: {}
        type: object
      message:
        example: Database is reachable
        format: string
        type: string
      response_time:
        example: 2.5ms
        format: string
        type: string
      status:
        example: healthy
        format: string
        type: string
    type: object
  domain.DatabasePoolStats:
    description: Database connection pool statistics.
    properties:
      acquire_count:
        example: 150
        type: integer
      acquire_duration_ns:
        example: 5000000
        type: integer
      acquired_connections:
        example: 5
        type: integer
      canceled_acquire_count:
        example: 2
        type: integer
      constructing_connections:
        example: 0
        type: integer
      empty_acquire_count:
        example: 100
        type: integer
      idle_connections:
        example: 10
        type: integer
      max_connections:
        example: 20
        type: integer
      total_connections:
        example: 15
        type: integer
    type: object
  domain.Paginator:
    description: Paginator represents a paginator.
    properties:
      limit:
        description: Maximum number of items per page
        example: 10
        format: int
        type: integer
      next_page:
        description: URL for the next page
        example: http://localhost:8080/users?next_token=ZmZmZmZmZmYtZmZmZi0tZmZmZmZmZmY=&limit=10
        format: string
        type: string
      next_token:
        description: Base64 encoded next page token
        example: ZmZmZmZmZmYtZmZmZi0tZmZmZmZmZmY=
        format: string
        type: string
      prev_page:
        description: URL for the previous page
        example: http://localhost:8080/users?prev_token=ZmZmZmZmZmYtZmZmZi0tZmZmZmZmZmY=&limit=10
        format: string
        type: string
      prev_token:
        description: Base64 encoded previous page token
        example: ZmZmZmZmZmYtZmZmZi0tZmZmZmZmZmY=
        format: string
        type: string
      size:
        description: Number of items in the current page
        example: 10
        format: int
        type: integer
    type: object
  domain.Project:
    description: Project represents a project.
    properties:
      created_at:
        description: Timestamp when the project was created
        example: "2021-01-01T00:00:00Z"
        format: date-time
        type: string
      description:
        description: Detailed description of the project's purpose
        example: This is my main project
        format: string
        type: string
      disabled:
        description: |-
          Disabled indicates if the project is disabled.
          Pointer to distinguish between false and unset values in partial responses.
        example: false
        type: boolean
      id:
        description: Unique identifier for the project
        example: 019b4b0d-a682-7e34-a20c-c71a7147d7e7
        format: uuid
        type: string
      name:
        description: Project display name
        example: My Project
        format: string
        type: string
      system:
        description: Indicates if this is a system-managed project (cannot be deleted)
        example: false
        type: boolean
      updated_at:
        description: Timestamp when the project was last updated
        example: "2021-01-01T00:00:00Z"
        format: date-time
        type: string
    type: object
  domain.StartupMetrics:
    description: Application startup timing metrics.
    properties:
      phase_percentage:
        additionalProperties: {}
        type: object
      phase_timings:
        additionalProperties: {}
        type: object
      total_time:
        example: 1.5s
        format: string
        type: string
    type: object
  domain.TokenType:
    enum:
    - access
    - refresh
    - email_verification
    - password_reset
    - personal_access
    - Bearer
    - idp_signin
    - idp_register
    - idp_link
    type: string
    x-enum-varnames:
    - TokenTypeAccess
    - TokenTypeRefresh
    - TokenTypeEmailVerification
    - TokenTypePasswordReset
    - TokenTypePersonalAccess
    - TokenTypeBearer
    - TokenTypeIDPSignin
    - TokenTypeIDPRegister
    - TokenTypeIDPLink
  payload.AuthzPaths:
    additionalProperties:
      description: HTTP methods granted on a path. "*" means every method
      items:
        type: string
      type: array
    description: API path to the methods granted on it. A key of "*" grants every
      path
    type: object
  payload.AuthzPermissions:
    additionalProperties:
      $ref: '#/definitions/payload.AuthzSubjects'
    description: Permission set by category; today the only category is "users"
    type: object
  payload.AuthzSubjects:
    additionalProperties:
      $ref: '#/definitions/payload.AuthzPaths'
    description: Subject id to the paths granted to it
    type: object
  payload.CreateIDPRequest:
    description: Request payload for creating a new identity provider configuration
    properties:
      auto_provision:
        description: Defaults to true
        example: true
        type: boolean
      callback_url:
        description: OAuth callback URL
        example: http://localhost:8080/api/v1/auth/idp/019b4b0d-a682-7e19-a524-866cfffef121/callback
        format: uri
        type: string
      client_id:
        description: OAuth client ID
        example: 367082405970-example
        format: string
        maxLength: 255
        minLength: 2
        type: string
      client_secret:
        description: OAuth client secret
        example: GOCSPX-example_secret_key
        format: string
        maxLength: 255
        minLength: 2
        type: string
      description:
        description: Description
        example: Google OAuth2 Identity Provider
        format: string
        maxLength: 500
        minLength: 10
        type: string
      enabled:
        description: Defaults to true
        example: true
        type: boolean
      id:
        description: Optional custom ID
        example: 019b4b0d-a682-7e19-a524-866cfffef121
        format: uuid
        type: string
      idp_type_id:
        description: Identity provider type ID
        example: 019b4b0d-a682-7e1d-bd83-3864c7d5aa43
        format: uuid
        type: string
      issuer_url:
        description: Required for an oidc kind; the value the ID token's iss must
          equal
        example: https://accounts.google.com
        format: uri
        type: string
      logo:
        description: Logo URL
        example: https://example.com/logo.png
        format: uri
        maxLength: 1024
        minLength: 10
        type: string
      name:
        description: Display name
        example: Google
        format: string
        maxLength: 100
        minLength: 2
        type: string
    required:
    - callback_url
    - client_id
    - client_secret
    - description
    - idp_type_id
    - name
    type: object
  payload.CreatePolicyRequest:
    description: Request payload for creating a new authorization policy
    properties:
      allowed_action:
        description: HTTP method allowed by this policy
        example: POST
        format: string
        type: string
      allowed_resource:
        description: Resource path pattern (supports wildcards and UUIDs)
        example: /projects/*/tokens
        format: string
        type: string
      description:
        description: Detailed description of the policy's purpose and scope
        example: Allows managing API tokens for specific projects
        format: string
        maxLength: 1024
        minLength: 2
        type: string
      id:
        description: Optional custom policy ID (auto-generated if not provided)
        example: 019b4b0d-a682-7e38-b235-3dfcb59f4d9e
        format: uuid
        type: string
      name:
        description: Policy display name
        example: Project Tokens Manager
        format: string
        maxLength: 255
        minLength: 2
        type: string
    required:
    - allowed_action
    - allowed_resource
    - name
    type: object
  payload.CreateProductRequest:
    description: Request payload for creating a new product within a project
    properties:
      description:
        description: Detailed description of the product
        example: This is a product
        format: string
        maxLength: 1024
        minLength: 2
        type: string
      id:
        description: Optional custom product ID (auto-generated if not provided)
        example: 01980434-b7ff-7abe-a45d-7311bc7011f5
        format: uuid
        type: string
      name:
        description: Product name, unique within its project
        example: Product Name
        format: string
        maxLength: 255
        minLength: 2
        type: string
    required:
    - description
    - name
    type: object
  payload.CreateProjectRequest:
    description: Request payload for creating a new project workspace
    properties:
      description:
        description: Detailed description of the project's purpose
        example: A workspace for team collaboration
        format: string
        maxLength: 500
        minLength: 10
        type: string
      id:
        description: Optional custom project ID (auto-generated if not provided)
        example: 019b4b0d-a682-7dea-9751-9b2bb20b0132
        format: uuid
        type: string
      name:
        description: Project display name
        example: My New Project
        format: string
        maxLength: 100
        minLength: 2
        type: string
    required:
    - description
    - name
    type: object
  payload.CreateRateLimitRequest:
    description: Request payload for creating a rate-limit rule
    properties:
      audience:
        description: Defaults to any
        example: auth
        format: string
        type: string
      description:
        description: What the rule is for
        example: One expensive call, seconds of wall clock, real money
        format: string
        maxLength: 1024
        minLength: 2
        type: string
      enabled:
        description: Defaults to true
        example: true
        type: boolean
      id:
        description: Optional custom ID
        example: 019b4b0d-a682-7e38-b235-3dfcb59f4d9e
        format: uuid
        type: string
      methods:
        description: Verbs the rule covers. ["*"] means any verb and ONE shared budget
          across them
        example:
        - POST
        items:
          format: array
          type: string
        type: array
      name:
        description: Rule display name
        example: Generate per project
        format: string
        maxLength: 100
        minLength: 2
        type: string
      scope:
        description: What the bucket is keyed on
        example: project
        format: string
        type: string
      strategy:
        description: Defaults to token_bucket
        example: leaky_bucket
        format: string
        type: string
      target:
        description: Route template as registered. A prefix must end with /; a global
          rule must use *
        example: /projects/{project_id}/generate
        format: string
        type: string
      target_kind:
        description: How target is matched
        example: endpoint
        format: string
        type: string
      windows:
        description: At least one. All apply; the shortest period is evaluated first
        items:
          $ref: '#/definitions/payload.RateLimitWindowRequest'
        type: array
    required:
    - description
    - methods
    - name
    - scope
    - target
    - target_kind
    - windows
    type: object
  payload.CreateRoleRequest:
    description: Request payload for creating a new role with permissions
    properties:
      description:
        description: Description of the role's responsibilities and scope
        example: Content editor role
        format: string
        maxLength: 500
        minLength: 10
        type: string
      id:
        description: Optional custom role ID
        example: 019b4b0d-a682-7f0b-a592-7bc362bae397
        format: uuid
        type: string
      name:
        description: Role display name
        example: Editor
        format: string
        maxLength: 100
        minLength: 2
        type: string
    required:
    - description
    - name
    type: object
  payload.CreateUserRequest:
    description: Request payload for creating a new user account
    properties:
      email:
        description: User's email address (must be unique)
        example: john.doe@example.com
        format: email
        type: string
      first_name:
        description: User's first name
        example: John
        format: string
        maxLength: 50
        minLength: 2
        type: string
      id:
        description: Optional custom user ID
        example: 019b4b0d-a682-7013-91b4-d452c93dfa47
        format: uuid
        type: string
      last_name:
        description: User's last name
        example: Doe
        format: string
        maxLength: 50
        minLength: 2
        type: string
      password:
        description: User's password (minimum 8 characters)
        example: SecureP@ssw0rd123
        format: password
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  payload.DetailedHealth:
    description: Comprehensive health information including component status and metrics.
    properties:
      components:
        additionalProperties:
          $ref: '#/definitions/domain.ComponentHealth'
        type: object
      database_pool:
        $ref: '#/definitions/domain.DatabasePoolStats'
      startup_metrics:
        $ref: '#/definitions/domain.StartupMetrics'
      status:
        example: healthy
        format: string
        type: string
      uptime:
        example: 2h30m45s
        format: string
        type: string
      version:
        example: 1.0.0
        format: string
        type: string
    type: object
  payload.EffectiveRateLimitEntry:
    description: A rule that applies to a request, with the reason it won its scope
    properties:
      name:
        example: Generate per project
        format: string
        type: string
      rule_id:
        example: 019b4b0d-a682-7e34-a20c-c71a7147d7e7
        format: uuid
        type: string
      scope:
        description: What this rule buckets on
        example: project
        format: string
        type: string
      strategy:
        example: leaky_bucket
        format: string
        type: string
      why:
        description: |-
          Why is prose on purpose. The ladder is what operators get wrong, and a
          tier number answers "which rung" when the question being asked is "why
          not the other rule".
        example: exact endpoint and a named verb — the most specific match there is
        format: string
        type: string
      windows:
        items:
          $ref: '#/definitions/payload.RateLimitWindowResponse'
        type: array
    type: object
  payload.EffectiveRateLimitsResponse:
    description: The rules that apply to a method and endpoint, one per scope, most
      specific first
    properties:
      bucket_key:
        description: |-
          BucketKey states what a budget is keyed on, because "10 per minute" alone
          does not say per what. A rule's verbs share one budget; each of its windows
          gets its own.
        example: (rule_id, window_id, scope_key) — one budget per window, shared across
          the rule's verbs
        format: string
        type: string
      effective:
        description: |-
          Effective carries ONE entry per scope. That is the shape of the design: an
          IP rule and a project rule both apply, and neither substitutes for the
          other.
        items:
          $ref: '#/definitions/payload.EffectiveRateLimitEntry'
        type: array
      endpoint:
        example: /projects/{project_id}/generate
        format: string
        type: string
      enforcing:
        description: |-
          Enforcing is false when ratelimit.enabled=false: the rules below are real
          and editable, and nothing is applying them. A client that renders the
          rules without rendering this tells an operator a limit is in place that
          is not.
        example: true
        type: boolean
      method:
        example: POST
        format: string
        type: string
    type: object
  payload.GetAuthenticatedUserResponse:
    description: Response containing authenticated user details and their complete
      permission set
    properties:
      account:
        allOf:
        - $ref: '#/definitions/payload.UserResponse'
        description: Authenticated user's account information
      permissions:
        allOf:
        - $ref: '#/definitions/payload.AuthzPermissions'
        description: Complete set of permissions granted to the user through roles
          and policies
    type: object
  payload.HTTPMessage:
    description: HTTPMessage represents a message to be sent to the client trough
      HTTP REST API.
    properties:
      code:
        description: |-
          Code is a stable, machine-readable reason, present only where a client
          has to BRANCH on it. Message is prose and may be reworded; this is not.

          It exists because a 401 has two meanings a client must treat differently:
          an expired access token should be refreshed and the request retried,
          while a revoked one must not be — the refresh token was revoked in the
          same breath, so the retry burns two requests and fails anyway. Nothing in
          the old response distinguished them, and a client cannot be asked to
          match on English.

          Empty on every response that does not need one, so no existing client
          sees a change.
        example: token_revoked
        format: string
        type: string
      message:
        example: success
        format: string
        type: string
      method:
        example: GET
        format: string
        type: string
      path:
        example: /api/v1/users
        format: string
        type: string
      status_code:
        example: 200
        format: int32
        type: integer
      timestamp:
        example: "2021-07-01T00:00:00Z"
        format: date-time
        type: string
    type: object
  payload.Health:
    description: Health check of the service.
    properties:
      checks:
        items:
          $ref: '#/definitions/domain.Check'
        type: array
      status:
        description: Health status of a service.
        example: true
        format: string
        type: boolean
    type: object
  payload.IDPAvailableResponse:
    description: Available identity provider information including type and branding
      details
    properties:
      auto_provision:
        description: |-
          Whether a sign-in from an identity nobody has linked yet creates an
          account. The login page offers "register with" only when this is true.
        example: true
        format: boolean
        type: boolean
      description:
        description: Detailed description
        example: Google Identity Provider
        format: string
        type: string
      id:
        description: Unique identifier
        example: 019b4b0d-a682-7d88-9ce1-12d63815e879
        format: uuid
        type: string
      idp_type:
        allOf:
        - $ref: '#/definitions/payload.IDPTypesAvailable'
        description: Type information for this identity provider
      logo:
        description: URL to the identity provider's logo image
        example: https://example.com/logo.png
        format: uri
        type: string
      name:
        description: Display name of the identity provider
        example: Google
        format: string
        type: string
    type: object
  payload.IDPCallbackResponse:
    description: 'The outcome of a provider callback: a session for login and register,
      the linked account for link'
    properties:
      event:
        description: Which event the state was minted for
        example: login
        format: string
        type: string
      linked_to:
        description: The account, for link
        example: 019b4b0d-a682-7e34-a20c-c71a7147d7e7
        format: uuid
        type: string
      login:
        allOf:
        - $ref: '#/definitions/payload.LoginUserResponse'
        description: The session, for login and register
    type: object
  payload.IDPLoginResponse:
    description: Response containing OAuth redirect information for initiating login
      flow
    properties:
      idp_id:
        example: 019b4b0d-a682-7e25-b4c8-afa26aa7d1dc
        format: uuid
        type: string
      redirect_code:
        example: 302
        type: integer
      redirect_url:
        format: uri
        type: string
    type: object
  payload.IDPRegisterResponse:
    description: Response containing OAuth redirect information for initiating registration
      flow
    properties:
      idp_id:
        example: 019b4b0d-a682-7e29-b6e2-a4cc6db87ea8
        format: uuid
        type: string
      redirect_code:
        example: 302
        type: integer
      redirect_url:
        format: uri
        type: string
    type: object
  payload.IDPResponse:
    description: Complete identity provider configuration including OAuth credentials
      and redirect URLs
    properties:
      auto_provision:
        description: A first sign-in with a provider-verified email may create an
          account
        example: true
        type: boolean
      callback_url:
        description: 'The redirect_uri registered with the provider: the frontend''s
          callback route URL'
        example: https://app.example.com/auth/idp/019b4b0d-a682-7e19-a524-866cfffef121/callback
        format: uri
        type: string
      client_id:
        description: OAuth client ID
        example: 367082405970-example
        format: string
        type: string
      created_at:
        description: Timestamp when the identity provider was created
        example: "2021-01-01T00:00:00Z"
        format: date-time
        type: string
      description:
        description: Description
        example: Google Identity Provider
        format: string
        type: string
      enabled:
        description: Offered on the login page and accepted at the callback
        example: true
        type: boolean
      id:
        description: Unique identifier
        example: 019b4b0d-a682-7e11-90b0-c94f29b8483a
        format: uuid
        type: string
      idp_type:
        allOf:
        - $ref: '#/definitions/payload.IDPTypesResponse'
        description: Type
      issuer_url:
        description: OpenID Connect issuer; empty for the github kind
        example: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
        format: uri
        type: string
      logo:
        description: Logo URL
        example: https://example.com/logo.png
        format: uri
        type: string
      name:
        description: Display name
        example: Google
        format: string
        type: string
      updated_at:
        description: Timestamp when the identity provider was last updated
        example: "2021-01-01T00:00:00Z"
        format: date-time
        type: string
    type: object
  payload.IDPTypesAvailable:
    description: Available identity provider types that can be configured in the system
    properties:
      description:
        description: Detailed description of the identity provider type
        example: Google OAuth2.0 Provider
        format: string
        type: string
      id:
        description: Unique identifier for the identity provider type
        example: 019b4b0d-a682-7e2c-86fa-05e7237c0c5b
        format: uuid
        type: string
      name:
        description: Display name of the identity provider type (e.g., Google, Github)
        example: Google
        format: string
        type: string
    type: object
  payload.IDPTypesResponse:
    description: Complete identity provider type information including OAuth scopes
      and API endpoints
    properties:
      created_at:
        description: Timestamp when the identity provider type was created
        example: "2021-01-01T00:00:00Z"
        format: date-time
        type: string
      description:
        description: Detailed description of the identity provider type and its capabilities
        example: Google OAuth2.0 Identity Provider
        format: string
        type: string
      id:
        description: Unique identifier for the identity provider type
        example: 019b4b0d-a682-7e30-8b33-650caa6446c7
        format: uuid
        type: string
      issuer_hint:
        description: What to put in an instance's issuer_url; empty for the github
          kind
        example: https://login.microsoftonline.com/<tenant-id>/v2.0
        format: uri
        type: string
      kind:
        description: 'How the provider is spoken to: oidc (discovery, PKCE, ID token)
          or github (plain OAuth2)'
        example: oidc
        format: string
        type: string
      name:
        description: Display name of the identity provider type (e.g., Google, Github,
          Microsoft)
        example: Google
        format: string
        type: string
      scopes:
        description: OAuth scopes required for this identity provider type
        example:
        - openid
        - email
        - profile
        items:
          format: csv
          type: string
        type: array
      serial_id:
        description: Sequential identifier for ordering
        example: 1
        type: integer
      system:
        description: Indicates if this is a system-managed identity provider type
          (cannot be deleted)
        example: true
        type: boolean
      updated_at:
        description: Timestamp when the identity provider type was last updated
        example: "2021-01-01T00:00:00Z"
        format: date-time
        type: string
      user_info_api_url:
        description: User-info endpoint, stated only for the github kind; an oidc
          kind discovers it
        example: https://api.github.com/user
        format: uri
        type: string
    type: object
  payload.LinkPoliciesToRoleRequest:
    description: Request payload for attaching multiple policies to a role
    properties:
      policy_ids:
        description: Array of policy IDs to attach to the role
        example:
        - 019b4b0d-a682-7e34-a20c-c71a7147d7e7
        - 019b4b0d-a682-7e38-b235-3dfcb59f4d9e
        items:
          format: array
          type: string
        type: array
    required:
    - policy_ids
    type: object
  payload.LinkProjectsToUserRequest:
    description: Request payload for associating multiple projects with a user
    properties:
      project_ids:
        description: Array of project IDs to associate with the user
        example:
        - 019b4b0d-a682-7e34-a20c-c71a7147d7e7
        - 019b4b0d-a682-7e38-b235-3dfcb59f4d9e
        items:
          format: array
          type: string
        type: array
    required:
    - project_ids
    type: object
  payload.LinkRolesToPolicyRequest:
