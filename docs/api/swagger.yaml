  payload.RefreshTokenRequest:
    description: Request payload for obtaining a new access token using a refresh
      token
    properties:
      refresh_token:
        description: |-
          Optional. The token actually spent is the one in the Authorization
          header, which is what the middleware verified. This field is kept because
          every existing client sends the token in both places, but it may not
          disagree with the header: a request authorised with one token and asking
          to spend another is refused rather than resolved by picking one.
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        format: string
        type: string
    type: object
  payload.RefreshTokenResponse:
    description: Response containing new authentication tokens after successful refresh
    properties:
      access_token:
        description: New JWT access token
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        format: string
        type: string
      refresh_token:
        description: New JWT refresh token
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        format: string
        type: string
      token_type:
        allOf:
        - $ref: '#/definitions/domain.TokenType'
        description: Token type (always "Bearer")
        example: Bearer
        format: string
    type: object
  payload.RegisterUserRequest:
    description: Request payload for creating a new user account with email verification
    properties:
      email:
        description: User's email address
        example: john.doe@example.com
        format: email
        type: string
      first_name:
        description: User's first name
        example: John
        format: string
        maxLength: 50
        minLength: 2
        type: string
      id:
        description: Optional custom user ID
        example: 019b4b0d-a682-7e41-8c2d-f3a4b5c6d7e8
        format: uuid
        type: string
      last_name:
        description: User's last name
        example: Doe
        format: string
        maxLength: 50
        minLength: 2
        type: string
      password:
        description: User's password (minimum 8 characters)
        example: SecureP@ssw0rd123
        format: password
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  payload.ResetPasswordRequest:
    description: Request payload for setting a new password using a reset token
    properties:
      password:
        description: New password to set (minimum 8 characters)
        example: NewSecureP@ssw0rd
        format: password
        maxLength: 72
        minLength: 8
        type: string
    required:
    - password
    type: object
