  payload.RateLimitResponse:
    description: 'A rate-limit rule: where it applies, who to, what it buckets on,
      and how it is enforced'
    properties:
      audience:
        description: Which callers the rule applies to
        example: auth
        format: string
        type: string
      created_at:
        description: When the rule was created
        example: "2021-01-01T00:00:00Z"
        format: date-time
        type: string
      description:
        description: What the rule is for
        example: One expensive call, seconds of wall clock
        format: string
        type: string
      enabled:
        description: Whether the rule is applied
        example: true
        type: boolean
      id:
        description: Unique identifier for the rule
        example: 019b4b0d-a682-7e34-a20c-c71a7147d7e7
        format: uuid
        type: string
      methods:
        description: HTTP verbs the rule covers, or ["*"] for any
        example:
        - POST
        items:
          format: array
          type: string
        type: array
      name:
        description: Rule display name
        example: Generate per project
        format: string
        type: string
      scope:
        description: What the bucket is keyed on
        example: project
        format: string
        type: string
      strategy:
        description: How the budget is enforced
        example: leaky_bucket
        format: string
        type: string
      system:
        description: System-managed rules cannot be modified or deleted
        example: false
        type: boolean
      target:
        description: Route template, prefix, or * for the global rule
        example: /projects/{project_id}/generate
        format: string
        type: string
      target_kind:
        description: How target is matched
        example: endpoint
        format: string
        type: string
      updated_at:
        description: When the rule was last updated
        example: "2021-01-01T00:00:00Z"
        format: date-time
        type: string
      windows:
        description: Budgets, all of which apply
        items:
          $ref: '#/definitions/payload.RateLimitWindowResponse'
        type: array
    type: object
  payload.RateLimitWindowRequest:
    description: One window of a rate-limit rule
    properties:
      burst:
        description: Capacity at once. Omit or 0 to mean the same as requests
        example: 300
        type: integer
      period:
        description: Window as a duration string, between 1s and 24h
        example: 1m0s
        format: string
        type: string
      requests:
        description: Requests allowed within the period
        example: 300
        minimum: 1
        type: integer
    required:
    - period
    - requests
    type: object
  payload.RateLimitWindowResponse:
    description: 'One window of a rate-limit rule: a request budget over a period'
    properties:
      burst:
        description: Capacity available at once. 0 means the same as requests
        example: 300
        type: integer
      id:
        description: Unique identifier for the window
        example: 019b4b0d-a682-7e34-a20c-c71a7147d7e7
        format: uuid
        type: string
      period:
        description: |-
          Period is rendered as a Go duration string ("1m0s"), not as seconds.
          Seconds are what the column holds; a duration is what an operator reads
          and what every other duration in this API uses.
        example: 1m0s
        format: string
        type: string
      requests:
        description: Requests allowed within the period
        example: 300
        type: integer
    type: object
