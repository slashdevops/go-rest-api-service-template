            $ref: '#/definitions/payload.Version'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/payload.HTTPMessage'
      summary: Get service version
      tags:
      - Version
securityDefinitions:
  AccessToken:
    description: 'The ordinary credential: `Bearer <access_token>`, from `POST /auth/login`
      or `POST /auth/refresh`. Every endpoint outside `/auth`, `/health` and `/version`
      takes it. A personal access token is presented the same way and is accepted
      anywhere an access token is -- which is how a script authenticates without a
      login. Deliberately short-lived; refresh rather than lengthening it.'
    in: header
    name: Authorization
    type: apiKey
  RefreshToken:
    description: '`Bearer <refresh_token>`, and accepted **only** by `POST /auth/refresh`
      and `DELETE /auth/logout`. Refreshing spends it and returns a successor: store
      what comes back. Presenting a spent one is treated as a replay and ends the
      whole session, including for whoever holds the live token.'
    in: header
    name: Authorization
    type: apiKey
  ResetPasswordToken:
    description: '`Bearer <reset_password_token>`, accepted only by `POST /auth/password/reset`.
      Issued by `POST /auth/password/recover` and delivered by email, single use.'
    in: header
    name: Authorization
    type: apiKey
  VerificationToken:
    description: '`Bearer <verification_token>`, accepted only by `POST /auth/verify/confirm`.
      It proves an email address rather than exercising a permission, so it is the
      one credential no authorization check is applied to -- the account it belongs
      to is still disabled at that point. It never travels in a URL: the emailed link
      points at the frontend, which presents the token in this header.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Sign in, sign out, refresh, register, verify an address and recover
    a password. Also the identity-provider registry and the OAuth flows through it.
  name: Authentication
- description: The calling user's own account, effective permissions and resource
    limits. Everything here is scoped to whoever holds the token.
  name: Me
- description: 'The worked example entity: a project-scoped CRUD resource. Copy it
    when adding your own.'
  name: Products
- description: The tenant boundary. Every product, configuration and limit hangs off
    a project, and most paths in this API begin with one.
  name: Projects
- description: Accounts, and their links to roles and projects. Both directions of
    every link are available.
  name: Users
- description: Named bundles of policies, and the users they are granted to.
  name: Roles
- description: What a role may do, expressed as actions over resources. A policy names
    resources from the catalogue below.
  name: Policies
- description: The endpoint catalogue policies are written against -- one entry per
    operation in this API, generated from these annotations.
  name: Resources
- description: 'How much a scope may create, and how much of it already exists. Read-only:
    limits are not editable through the API.'
  name: Resources Limits
- description: The rate-limit rules, and a preview of which would actually apply to
    a given method and endpoint.
  name: RateLimits
- description: Liveness, readiness and a public status summary. All of it bypasses
    the rate limiter.
  name: Health
- description: What a caller may do, resolved. `/me/authz` answers it for the caller
    and `/users/{id}/authz` for anyone else; both return the permission set roles
    and policies add up to, rather than the roles and policies themselves.
  name: Authorization
- description: External OAuth providers, and the login and registration flows through
    them. The callback is browser-driven and answers a redirect, not JSON.
  name: Identity Providers (IDPs)
- description: The provider kinds an IdP can be configured as. Reference data.
  name: Identity Provider Types
- description: The build this instance was made from. Public, and the quickest way
    to tell which deployment answered.
  name: Version
