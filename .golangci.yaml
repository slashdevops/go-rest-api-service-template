version: "2"
linters:
  # Enable specific linter
  # https://golangci-lint.run/usage/linters/#enabled-by-default
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused

  # Disable specific linter
  # https://golangci-lint.run/usage/linters/#disabled-by-default
  disable:
    # Enable presets.
    # https://golangci-lint.run/usage/linters
    # Default: []
    - godot
    - wsl
    - testpackage
    - whitespace
    - tagalign
    - nosprintfhostport
    - nlreturn
    - nestif
    - mnd
    - misspell
    - lll
    - godox
    - funlen
    - gochecknoinits
    - depguard
    - goconst
    - dupword
    - cyclop
    - gocognit
    - maintidx
    - gocyclo
    - dupl

  settings:
    errcheck:
      # Report about not checking of errors in type assertions: `a := b.(MyStruct)`.
      # Such cases aren't reported by default.
      # Default: false
      check-type-assertions: false
      # report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`.
      # Such cases aren't reported by default.
      # Default: false
      check-blank: false
      # To disable the errcheck built-in exclude list.
      # See `-excludeonly` option in https://github.com/kisielk/errcheck#excluding-functions for details.
      # Default: false
      disable-default-exclusions: true
      # List of functions to exclude from checking, where each entry is a single function to exclude.
      # See https://github.com/kisielk/errcheck#excluding-functions for details.
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - io/ioutil.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
        - (io.Writer).Write
        - (*bufio.Writer).Write
        - (*encoding/json.Encoder).Encode
        - os.Setenv
        - os.Unsetenv
        - fmt.Printf
        - fmt.Print
        - fmt.Println
        - fmt.Fprintf
        - (*strings.Builder).WriteString
        - github.com/slashdevops/go-rest-api-service-template/internal/o11y.RecordError
  exclusions:
    rules:
      # G101 matches on the NAME of a constant ("token", "key", "secret"),
      # not on its value; here every hit is a field name, a header name or a
      # constraint name. The one hardcoded credential in this repository is
      # the seeded administrator's hash in internal/app/seededadmin.go, kept
      # on purpose so the service can refuse to start with it in place.
      - linters: [gosec]
        text: G101
      # Key, certificate and env files are opened from paths the operator
      # supplies through flags; that is what the paths are for.
      - path: internal/(app|config)/
        linters: [gosec]
        text: G304
      # Test files carry fixture keys and captured credentials on purpose, and
      # open testdata by a variable path. None of it ships.
      - path: _test\.go
        linters: [gosec]
      # The repository layer builds SQL with html/template and defeats its
      # escaping with template.HTML: a documented wart (CLAUDE.md, "SQL rules"),
      # not markup. Values still go through placeholders.
      - path: internal/adapter/driven/repositorypg/
        linters: [gosec]
        text: G203
